# GZM custom libraries
CONFIG_GZM_COMMON=y
CONFIG_GZM_RTC_MGR=y
CONFIG_GZM_WIFI_MGR=y
CONFIG_GZM_FS_MGR=y
CONFIG_GZM_RINGTONE=y

CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=y
# Habilita Wi-Fi com o driver CYW43xx do Raspberry Pi Pico W
CONFIG_WIFI=y
CONFIG_WIFI_AIROC=y
CONFIG_NET_L2_WIFI_MGMT=y

# Networking geral com IPv4 e DHCP
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
# CONFIG_NET_CONFIG_SETTINGS disabled: wifi_mgr handles DHCP/WiFi directly

# SNTP client
CONFIG_SNTP=y

# Suporte à geração de números aleatórios
# CONFIG_ENTROPY_GENERATOR não é usado: RP2040 não tem driver de entropia em Zephyr
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

# Logs e shell para testes
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_NET_SHELL=y
CONFIG_NET_LOG=y
CONFIG_WIFI_LOG_LEVEL_WRN=y

# Shell via Telnet (porta 23)
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_SHELL_TELNET_PORT=23
CONFIG_SHELL_TELNET_SUPPORT_COMMAND=y

# Pilhas de execução
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=1024
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_INIT_STACKS=y

# Debug de crashes
CONFIG_DEBUG=y
CONFIG_EXCEPTION_DEBUG=y
CONFIG_FAULT_DUMP=2
CONFIG_EXTRA_EXCEPTION_INFO=y

# Heap para operações de rede, filesystem e HTTP server
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Delay e temporizadores
CONFIG_TIMING_FUNCTIONS=y

# Console via USB CDC ACM (nova stack USB do Zephyr 4.3)
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="gzm-embedded-systems"
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USBD_LOG_LEVEL_WRN=y

# RTC - Real Time Clock
CONFIG_RTC=y
CONFIG_RTC_SHELL=y

# HWINFO - reset cause + device ID (used by setup_init_sanity)
CONFIG_HWINFO=y

# Watchdog - resets the SoC if firmware hangs (5 s timeout)
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# Flash e File System
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# LittleFS
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y

# LittleFS - configurações otimizadas para RP2040
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=4096
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
CONFIG_FS_LITTLEFS_PROG_SIZE=256
CONFIG_FS_LITTLEFS_READ_SIZE=16
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=128

# Storage (necessário para montar o filesystem)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# HTTP Server
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=2
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=256
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y

# JSON library (para Relay API)
CONFIG_JSON_LIBRARY=y

# GPIO (relays)
CONFIG_GPIO=y

# PWM (buzzer passivo GP6)
CONFIG_PWM=y

# LED Strip - WS2812 via PIO (GP13)
CONFIG_LED_STRIP=y

# mDNS
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="embarcados"

# File descriptors (eventfd + sockets para HTTP server)
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_ZVFS_EVENTFD_MAX=2
CONFIG_NET_SOCKETS_POLL_MAX=6
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2048

# Network buffers (ajustados para HTTP server + WiFi no RP2040)
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=8
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048