# Debug configuration for RP2040
# Note: Avoid CONFIG_DEBUG_OPTIMIZATIONS as it can affect
# flash functions placement in RAM

CONFIG_DEBUG=y
CONFIG_DEBUG_THREAD_INFO=y

# NAO habilitar CONFIG_ARM_MPU / CONFIG_HW_STACK_PROTECTION neste SoC.
# Com CONFIG_XIP=y o REGION_RAM_ATTR do Zephyr marca toda a SRAM como
# execute-never (MPU_RASR_XN_Msk). As rotinas de flash do RP2040 sao
# __no_inline_not_in_flash_func, ou seja, rodam a partir da SRAM porque o
# XIP precisa ser desligado para falar com a QSPI. Resultado: hard fault
# em flash_do_cmd() logo no boot (hwinfo -> serial USB, littlefs, etc).
#
# Substituto por software para detectar estouro de pilha, sem MPU:
# grava um valor magico na base de cada pilha e verifica a cada troca
# de contexto, matando a thread culpada com log em vez de corromper.
CONFIG_STACK_SENTINEL=y

# Relatorio periodico de uso de pilha por thread (precisa de INIT_STACKS,
# ja habilitado no prj.conf).
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10
CONFIG_THREAD_NAME=y
