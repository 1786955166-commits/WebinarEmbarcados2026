<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial,sans-serif">
  <rect width="1280" height="720" fill="white"/>

  <defs>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrd" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">HTTP_RESOURCE_DEFINE: para onde vai cada URL</text>
  <line x1="80" y1="54" x2="1200" y2="54" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Input from clients -->
  <rect x="490" y="70" width="300" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="640" y="95" text-anchor="middle" font-size="13" fill="#1e293b">URL chega de curl ou browser (porta 80)</text>

  <line x1="640" y1="110" x2="640" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrd)"/>

  <!-- HTTP_RESOURCE_DEFINE box -->
  <rect x="370" y="138" width="540" height="70" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <text x="640" y="166" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">HTTP_RESOURCE_DEFINE</text>
  <text x="640" y="186" text-anchor="middle" font-size="11" font-family="monospace" fill="#475569">web_app.c, linhas 295-306</text>
  <text x="640" y="201" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">tabela URL → detail (static_data ou handler)</text>

  <!-- Split arrows -->
  <line x1="640" y1="208" x2="640" y2="224" stroke="#475569" stroke-width="2"/>
  <line x1="640" y1="224" x2="320" y2="224" stroke="#2563eb" stroke-width="2"/>
  <line x1="320" y1="224" x2="320" y2="248" stroke="#2563eb" stroke-width="2" marker-end="url(#arrb)"/>
  <line x1="640" y1="224" x2="960" y2="224" stroke="#d97706" stroke-width="2"/>
  <line x1="960" y1="224" x2="960" y2="248" stroke="#d97706" stroke-width="2" marker-end="url(#arro)"/>

  <!-- Section headers -->
  <text x="320" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">STATIC RESOURCE</text>
  <text x="320" y="288" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">byte array, kernel envia raw  ·  4 rotas</text>

  <text x="960" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">DYNAMIC RESOURCE</text>
  <text x="960" y="288" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">callback em C executa  ·  8 rotas</text>

  <!-- ════════ LEFT: STATIC ════════ -->
  <rect x="80" y="305" width="480" height="200" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Static table headers -->
  <text x="100" y="328" font-size="10" font-weight="bold" fill="#1d4ed8">URL</text>
  <text x="260" y="328" font-size="10" font-weight="bold" fill="#1d4ed8">array em flash</text>
  <text x="430" y="328" font-size="10" font-weight="bold" fill="#1d4ed8">origem</text>
  <line x1="95" y1="334" x2="545" y2="334" stroke="#2563eb" stroke-width="0.8" opacity="0.4"/>

  <!-- Row 1: / -->
  <text x="100" y="356" font-size="11" font-family="monospace" fill="#1e293b">/</text>
  <text x="225" y="356" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="245" y="356" font-size="11" font-family="monospace" fill="#1e293b">index_html_gz[]</text>
  <text x="395" y="356" font-size="11" font-family="monospace" fill="#1e293b">←</text>
  <text x="415" y="356" font-size="11" font-family="monospace" fill="#15803d">index.html.gz.inc</text>

  <!-- Row 2: /style.css -->
  <text x="100" y="384" font-size="11" font-family="monospace" fill="#1e293b">/style.css</text>
  <text x="225" y="384" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="245" y="384" font-size="11" font-family="monospace" fill="#1e293b">style_css_gz[]</text>
  <text x="395" y="384" font-size="11" font-family="monospace" fill="#1e293b">←</text>
  <text x="415" y="384" font-size="11" font-family="monospace" fill="#15803d">style.css.gz.inc</text>

  <!-- Row 3: /app.js -->
  <text x="100" y="412" font-size="11" font-family="monospace" fill="#1e293b">/app.js</text>
  <text x="225" y="412" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="245" y="412" font-size="11" font-family="monospace" fill="#1e293b">app_js_gz[]</text>
  <text x="395" y="412" font-size="11" font-family="monospace" fill="#1e293b">←</text>
  <text x="415" y="412" font-size="11" font-family="monospace" fill="#15803d">app.js.gz.inc</text>

  <!-- Row 4: /api/info -->
  <text x="100" y="440" font-size="11" font-family="monospace" fill="#1e293b">/api/info</text>
  <text x="225" y="440" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="245" y="440" font-size="11" font-family="monospace" fill="#1e293b">info_json[]</text>
  <text x="395" y="440" font-size="11" font-family="monospace" fill="#1e293b">←</text>
  <text x="415" y="440" font-size="11" font-style="italic" fill="#15803d">string compile-time</text>

  <line x1="95" y1="455" x2="545" y2="455" stroke="#2563eb" stroke-width="0.8" opacity="0.4"/>

  <!-- Static note -->
  <text x="320" y="478" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Build time: CMake gzipa o arquivo</text>
  <text x="320" y="494" text-anchor="middle" font-size="10" font-style="italic" fill="#475569">generate_inc_file_for_target → .gz.inc → array em flash</text>

  <!-- ════════ RIGHT: DYNAMIC ════════ -->
  <rect x="720" y="305" width="480" height="320" rx="8" fill="#fed7aa" stroke="#d97706" stroke-width="1.5"/>

  <text x="740" y="328" font-size="10" font-weight="bold" fill="#9a3412">URL</text>
  <text x="930" y="328" font-size="10" font-weight="bold" fill="#9a3412">handler em web_app.c</text>
  <line x1="735" y1="334" x2="1185" y2="334" stroke="#d97706" stroke-width="0.8" opacity="0.4"/>

  <!-- Dynamic rows -->
  <text x="740" y="356" font-size="11" font-family="monospace" fill="#1e293b">/api/time</text>
  <text x="895" y="356" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="915" y="356" font-size="11" font-family="monospace" fill="#7c2d12">web_app_time_handler()</text>

  <text x="740" y="384" font-size="11" font-family="monospace" fill="#1e293b">/api/relays</text>
  <text x="895" y="384" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="915" y="384" font-size="11" font-family="monospace" fill="#7c2d12">web_app_relay_handler()</text>

  <text x="740" y="412" font-size="11" font-family="monospace" fill="#1e293b">/api/rgb</text>
  <text x="895" y="412" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="915" y="412" font-size="11" font-family="monospace" fill="#7c2d12">web_app_rgb_handler()</text>

  <text x="740" y="440" font-size="11" font-family="monospace" fill="#1e293b">/api/buzzer</text>
  <text x="895" y="440" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="915" y="440" font-size="11" font-family="monospace" fill="#7c2d12">web_app_buzzer_handler()</text>

  <text x="740" y="468" font-size="11" font-family="monospace" fill="#1e293b">/api/files</text>
  <text x="895" y="468" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="915" y="468" font-size="11" font-family="monospace" fill="#7c2d12">web_app_files_handler()</text>

  <text x="740" y="496" font-size="11" font-family="monospace" fill="#1e293b">/api/upload</text>
  <text x="895" y="496" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="915" y="496" font-size="11" font-family="monospace" fill="#7c2d12">web_app_upload_handler()</text>

  <text x="740" y="524" font-size="11" font-family="monospace" fill="#1e293b">/api/delete</text>
  <text x="895" y="524" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="915" y="524" font-size="11" font-family="monospace" fill="#7c2d12">web_app_delete_handler()</text>

  <text x="740" y="552" font-size="11" font-family="monospace" fill="#1e293b">/download/*</text>
  <text x="895" y="552" font-size="11" font-family="monospace" fill="#1e293b">→</text>
  <text x="915" y="552" font-size="11" font-family="monospace" fill="#7c2d12">web_app_download_handler()</text>

  <line x1="735" y1="568" x2="1185" y2="568" stroke="#d97706" stroke-width="0.8" opacity="0.4"/>

  <text x="960" y="591" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">Runtime: handler em C executa</text>
  <text x="960" y="607" text-anchor="middle" font-size="10" font-style="italic" fill="#475569">parse JSON, lock, driver call (GPIO/RTC/FS/PWM), monta resposta</text>

  <!-- ════════ CONVERGENCE BOTTOM ════════ -->
  <line x1="320" y1="510" x2="320" y2="660" stroke="#2563eb" stroke-width="2"/>
  <line x1="960" y1="630" x2="960" y2="660" stroke="#d97706" stroke-width="2"/>
  <line x1="320" y1="660" x2="640" y2="660" stroke="#2563eb" stroke-width="2"/>
  <line x1="960" y1="660" x2="640" y2="660" stroke="#d97706" stroke-width="2"/>
  <line x1="640" y1="660" x2="640" y2="678" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrg)"/>

  <rect x="430" y="680" width="420" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="701" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Resposta HTTP enviada ao cliente</text>

</svg>
